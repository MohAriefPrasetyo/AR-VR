<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR – Kubus 3D</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: transparent; }

    /* ── Scanner UI ── */
    #ui {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      pointer-events: none;
      font-family: 'Segoe UI', sans-serif;
    }
    #hdr {
      width: 100%; padding: 14px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent);
      display: flex; align-items: center; gap: 10px;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #ff3b3b; box-shadow: 0 0 7px #ff3b3b;
      animation: bl 1s infinite; flex-shrink: 0;
    }
    @keyframes bl { 0%,100%{opacity:1} 50%{opacity:0.15} }
    #hdr span { color:#fff; font-size:.82rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }

    #mid { display:flex; flex-direction:column; align-items:center; gap:16px; }
    .frame { width:220px; height:220px; position:relative; }
    .tl,.tr,.bl,.br { position:absolute; width:30px; height:30px; border-style:solid; border-color:#fff; }
    .tl{top:0;left:0;border-width:3px 0 0 3px}
    .tr{top:0;right:0;border-width:3px 3px 0 0}
    .bl{bottom:0;left:0;border-width:0 0 3px 3px}
    .br{bottom:0;right:0;border-width:0 3px 3px 0}
    .line {
      position:absolute; left:5px; right:5px; height:2px;
      background:linear-gradient(90deg,transparent,#00e5ff,transparent);
      box-shadow:0 0 8px #00e5ff;
      animation:scan 2s ease-in-out infinite;
    }
    @keyframes scan{0%{top:5px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 7px);opacity:0}}
    #lbl { color:rgba(255,255,255,.9); font-size:.78rem; letter-spacing:.1em; text-shadow:0 1px 6px rgba(0,0,0,.9); }
    #badge {
      padding:6px 18px; border-radius:20px; font-size:.72rem; font-weight:700;
      background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2);
      color:rgba(255,255,255,.7); backdrop-filter:blur(4px); transition:all .4s;
    }
    #badge.found { background:rgba(0,200,80,.25); border-color:rgba(0,220,80,.6); color:#66ff99; }
    #ftr {
      width:100%; padding:12px 18px 28px;
      background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent);
      display:flex; align-items:center; justify-content:center; gap:12px;
    }
    #ftr p { color:rgba(255,255,255,.65); font-size:.72rem; line-height:1.5; max-width:200px; }
    #mref { width:56px; height:56px; border-radius:6px; border:2px solid rgba(255,255,255,.3); background:#fff; flex-shrink:0; }
  </style>
</head>
<body>

  <!-- Scanner UI -->
  <div id="ui">
    <div id="hdr">
      <div class="dot"></div>
      <span>AR Scanner Aktif</span>
    </div>
    <div id="mid">
      <div class="frame">
        <div class="tl"></div><div class="tr"></div>
        <div class="bl"></div><div class="br"></div>
        <div class="line"></div>
      </div>
      <div id="lbl">Arahkan ke Hiro Marker</div>
      <div id="badge">🔍 Mencari Marker…</div>
    </div>
    <div id="ftr">
      <img id="mref" src="https://jeromeetienne.github.io/AR.js/data/images/HIRO.jpg" alt="Hiro"/>
      <p>Arahkan ke <strong>Hiro Marker</strong> di layar laptop.</p>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-entity camera></a-entity>

    <a-marker preset="hiro" id="mk">
      <a-box
        position="0 0.5 0"
        width="0.5" height="0.5" depth="0.5"
        color="#00e5ff"
        material="metalness:0.5; roughness:0.2;"
        animation__rot="property:rotation; to:0 360 0; loop:true; dur:3000; easing:linear;"
        animation__float="property:position; from:0 0.4 0; to:0 0.75 0; loop:true; dir:alternate; dur:1500; easing:easeInOutSine;"
      ></a-box>
    </a-marker>
  </a-scene>

  <script>
    /* ════════════════════════════════════════════════
       ROOT FIX: Patch Three.js renderer setClearColor
       agar A-Frame background component tidak bisa
       menimpa background dengan warna hitam solid.
    ════════════════════════════════════════════════ */
    const scene = document.querySelector('a-scene');

    scene.addEventListener('loaded', function () {
      const renderer = this.renderer;

      // 1. Set ke transparan dulu
      renderer.setClearColor(0x000000, 0);
      renderer.setClearAlpha(0);

      // 2. PATCH: override setClearColor agar alpha selalu 0
      //    → A-Frame background component manggil ini tiap frame
      //    → Kita paksa alpha = 0 supaya canvas selalu transparan
      const _origSet = renderer.setClearColor.bind(renderer);
      renderer.setClearColor = function (color, alpha) {
        _origSet(0x000000, 0); // paksa transparan, abaikan alpha dari caller
      };

      // 3. Fix video element yang dibuat AR.js secara async
      const fixVideo = () => {
        document.querySelectorAll('video').forEach(function (vid) {
          vid.style.cssText = [
            'display:block!important',
            'position:fixed!important',
            'top:0!important',
            'left:0!important',
            'width:100%!important',
            'height:100%!important',
            'object-fit:cover!important',
            'z-index:0!important',
            'opacity:1!important',
            'visibility:visible!important'
          ].join(';');
        });

        // Canvas harus di atas video, background transparan
        document.querySelectorAll('canvas').forEach(function (c) {
          c.style.cssText = [
            'position:fixed!important',
            'top:0!important',
            'left:0!important',
            'width:100%!important',
            'height:100%!important',
            'z-index:1!important',
            'background:transparent!important'
          ].join(';');
        });
      };

      fixVideo();
      setTimeout(fixVideo, 300);
      setTimeout(fixVideo, 1000);
      setTimeout(fixVideo, 3000);
    });

    // Marker events
    const mk = document.getElementById('mk');
    const badge = document.getElementById('badge');
    mk.addEventListener('markerFound', function () {
      badge.textContent = '✅ Marker Ditemukan!';
      badge.classList.add('found');
    });
    mk.addEventListener('markerLost', function () {
      badge.textContent = '🔍 Mencari Marker…';
      badge.classList.remove('found');
    });
  </script>

</body>
</html>
