<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR – Kubus 3D</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas, video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; object-fit: cover; z-index: 0; }

    /* Scanner overlay */
    #ui {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    /* Header */
    #hdr {
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent);
      display: flex; align-items: center; gap: 10px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 7px #ff3b3b; animation: bl 1s infinite; }
    @keyframes bl { 0%,100%{opacity:1} 50%{opacity:0.15} }
    #hdr span { color: #fff; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Frame scanner */
    #mid { display: flex; flex-direction: column; align-items: center; gap: 18px; }

    .frame { width: 230px; height: 230px; position: relative; }
    .frame .tl,.frame .tr,.frame .bl,.frame .br { position: absolute; width: 32px; height: 32px; border-style: solid; border-color: #fff; }
    .frame .tl { top:0; left:0;  border-width: 3px 0 0 3px; }
    .frame .tr { top:0; right:0; border-width: 3px 3px 0 0; }
    .frame .bl { bottom:0; left:0;  border-width: 0 0 3px 3px; }
    .frame .br { bottom:0; right:0; border-width: 0 3px 3px 0; }

    .line {
      position: absolute; left: 5px; right: 5px; height: 2px;
      background: linear-gradient(90deg, transparent, #00e5ff, transparent);
      box-shadow: 0 0 8px #00e5ff;
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan { 0%{top:5px;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{top:calc(100% - 7px);opacity:0} }

    #lbl { color: rgba(255,255,255,0.85); font-size: 0.78rem; letter-spacing: 0.1em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }

    #badge {
      padding: 6px 18px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.65); backdrop-filter: blur(5px);
      transition: all 0.4s;
    }
    #badge.found {
      background: rgba(0,200,80,0.22); border-color: rgba(0,220,80,0.55);
      color: #66ff99; box-shadow: 0 0 12px rgba(0,200,80,0.25);
    }

    /* Footer */
    #ftr {
      width: 100%; padding: 12px 18px 28px;
      background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent);
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
    }
    #ftr p { color: rgba(255,255,255,0.6); font-size: 0.72rem; line-height: 1.5; max-width: 200px; }
    #mref { width: 58px; height: 58px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.3); background:#fff; flex-shrink:0; }
  </style>
</head>
<body>

  <!-- Scanner UI -->
  <div id="ui">
    <div id="hdr">
      <div class="dot"></div>
      <span>AR Scanner Aktif</span>
    </div>

    <div id="mid">
      <div class="frame">
        <div class="tl"></div><div class="tr"></div>
        <div class="bl"></div><div class="br"></div>
        <div class="line"></div>
      </div>
      <div id="lbl">Arahkan ke Hiro Marker</div>
      <div id="badge">🔍 Mencari Marker…</div>
    </div>

    <div id="ftr">
      <img id="mref" src="https://jeromeetienne.github.io/AR.js/data/images/HIRO.jpg" alt="Hiro" />
      <p>Arahkan kamera ke gambar <strong>Hiro Marker</strong> yang ada di layar laptop.</p>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="antialias: true; alpha: true;"
  >
    <a-entity camera></a-entity>

    <a-marker preset="hiro" id="mk">
      <a-box
        position="0 0.5 0"
        width="0.5" height="0.5" depth="0.5"
        color="#00e5ff"
        material="metalness:0.5; roughness:0.2;"
        animation__rot="property:rotation; to:0 360 0; loop:true; dur:3000; easing:linear;"
        animation__float="property:position; from:0 0.4 0; to:0 0.75 0; loop:true; dir:alternate; dur:1500; easing:easeInOutSine;"
      ></a-box>
    </a-marker>
  </a-scene>

  <script>
    const badge = document.getElementById('badge');
    const mk    = document.getElementById('mk');
    mk.addEventListener('markerFound', () => {
      badge.textContent = '✅ Marker Ditemukan!';
      badge.classList.add('found');
    });
    mk.addEventListener('markerLost', () => {
      badge.textContent = '🔍 Mencari Marker…';
      badge.classList.remove('found');
    });
  </script>

</body>
</html>
